name: Test
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - '**.c'
      - '**.h'
      - '**.cc'
      - '**.cpp'
      - go.mod
      - go.sum
      - scripts/**
      - testdata/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/**
  pull_request:
    paths:
      - '**.go'
      - '**.c'
      - '**.h'
      - '**.cc'
      - '**.cpp'
      - go.mod
      - go.sum
      - scripts/**
      - testdata/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
      - name: Build HiGHS and test Go wrapper
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          HIGHS_EXPECT_VERSION: '1.15.1'
        run: |
          $toolchain = Join-Path $env:MSYS2_ROOT 'ucrt64/bin'
          & ./scripts/build-highs.ps1 -ToolchainBin $toolchain
          . ./scripts/enter-dev.ps1 -ToolchainBin $toolchain
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./cmd/example
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-consumption.ps1 -ToolchainBin $toolchain
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t highs-go-test .
      - run: docker run --rm highs-go-test
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config python3 zsh
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config python
      - name: Verify workspace setup and separate consumer
        run: python3 scripts/test-consumption.py
      - name: Test Go wrapper
        shell: bash
        env:
          HIGHS_EXPECT_VERSION: '1.15.1'
        run: |
          source ./scripts/enter-dev.sh
          go test -race -count=1 ./...
          go vet ./...
